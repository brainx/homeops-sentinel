version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: homeops-sentinel_web_1
      APP_PORT: 4747

  web:
    image: ghcr.io/brainx/homeops-sentinel-umbrel:0.2.1@sha256:4a2b6ffa2474d13492cd7cf3c6d145116bc3c3934fb92c668f33c0248403f74c
    restart: on-failure
    stop_grace_period: 20s
    environment:
      HOST: 0.0.0.0
      PORT: 4747
      HOMEOPS_DATA_DIR: /data
      HOMEOPS_STATIC_DIR: /app/dist
      APP_SEED: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
